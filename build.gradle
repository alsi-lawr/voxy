plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'me.champeau.jmh' version '0.7.3'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

def includeOtherArchs = 'true'.equalsIgnoreCase(project.findProperty('includeOtherArchs'))

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

// Loom's newer build-JDK native upgrade must not override the selected game graph.
configurations.configureEach {
    resolutionStrategy.eachDependency { dependency ->
        if (dependency.requested.group == 'org.lwjgl') dependency.useVersion(project.lwjgl_version)
    }
}

loom { accessWidenerPath = file('src/main/resources/voxy.accesswidener') }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "maven.modrinth:sodium:${project.sodium_version}"
    modCompileOnly "maven.modrinth:iris:${project.iris_version}"
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    modCompileOnly "maven.modrinth:lithium:${project.lithium_version}"
    modCompileOnly "maven.modrinth:chunky:${project.chunky_version}"
    modCompileOnly "maven.modrinth:vivecraft:${project.vivecraft_version}"
    modCompileOnly "maven.modrinth:nvidium:${project.nvidium_version}"
    modCompileOnly "maven.modrinth:indium:${project.indium_version}"

    // Minecraft owns core/OpenGL LWJGL; Voxy supplies only the matching storage bindings.
    implementation platform("org.lwjgl:lwjgl-bom:${project.lwjgl_version}")
    include implementation("org.lwjgl:lwjgl-lmdb:${project.lwjgl_version}")
    include implementation("org.lwjgl:lwjgl-zstd:${project.lwjgl_version}")
    ['natives-linux', 'natives-windows'].each { classifier ->
        include runtimeOnly("org.lwjgl:lwjgl-lmdb:${project.lwjgl_version}:${classifier}")
        include runtimeOnly("org.lwjgl:lwjgl-zstd:${project.lwjgl_version}:${classifier}")
    }
    if (includeOtherArchs) {
        include runtimeOnly("org.lwjgl:lwjgl-lmdb:${project.lwjgl_version}:natives-linux-arm64")
        include runtimeOnly("org.lwjgl:lwjgl-zstd:${project.lwjgl_version}:natives-linux-arm64")
    }
    include implementation('redis.clients:jedis:5.1.0')
    // Required Jedis runtime dependency absent from the 1.20.1 game classpath.
    include implementation('org.json:json:20231013')
    include implementation('org.rocksdb:rocksdbjni:10.2.1')
    include implementation('org.apache.commons:commons-pool2:2.12.0')
    include implementation('org.lz4:lz4-java:1.8.0')
    include implementation('org.tukaani:xz:1.10')
}

configurations { irisPrototypeTools }
dependencies { irisPrototypeTools("maven.modrinth:iris:${project.iris_version}") { transitive = false } }
def extractIrisPrototypeTools = tasks.register('extractIrisPrototypeTools', Copy) {
    from { zipTree(configurations.irisPrototypeTools.singleFile) }
    include 'META-INF/jars/glsl-transformer-2.0.1.jar', 'META-INF/jars/antlr4-runtime-4.13.1.jar', 'META-INF/jars/jcpp-1.4.14.jar'
    eachFile { path = name }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('iris-prototype-tools')
}
def irisPrototypeTools = files(
    layout.buildDirectory.file('iris-prototype-tools/glsl-transformer-2.0.1.jar'),
    layout.buildDirectory.file('iris-prototype-tools/antlr4-runtime-4.13.1.jar'),
    layout.buildDirectory.file('iris-prototype-tools/jcpp-1.4.14.jar')
).builtBy(extractIrisPrototypeTools)
dependencies { compileOnly irisPrototypeTools; testRuntimeOnly irisPrototypeTools }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['--add-modules=jdk.incubator.vector']
    options.deprecation = true
}

def gitCommitHash = providers.exec {
    commandLine 'git', 'rev-parse', 'HEAD'
}.standardOutput.asText.map { it.trim() }

processResources {
    def props = [version: project.version, commit: gitCommitHash.get(),
                 buildtime: System.currentTimeMillis().intdiv(1000),
                 allowed_sodium_versions: '=0.5.13', allowed_mc_version: '=1.20.1']
    inputs.properties(props)
    filesMatching('fabric.mod.json') { expand(props) }
}

// Preserve upstream's smaller x86_64 RocksDB bundle without changing the storage engine.
def makeExcludedRocksDB = tasks.register('makeExcludedRocksDB', Zip) {
    archiveExtension = 'jar'
    entryCompression = ZipEntryCompression.STORED
    destinationDirectory = layout.buildDirectory.dir('tmp/rocksdb')
    def rocksdb = configurations.compileClasspath.filter { it.name.startsWith('rocksdbjni-') }
    from { zipTree(rocksdb.singleFile) }
    archiveFileName = 'rocksdbjni-10.2.1.jar'
    exclude { item ->
        def name = item.name
        name.endsWith('.jnilib') || (name.endsWith('.so') &&
            ['osx', 'linux32', 'musl', 's390x', 'riscv64', 'ppc64le', 'aarch64'].any(name::contains))
    }
}

if (!includeOtherArchs) {
    tasks.named('processIncludeJars') {
        dependsOn makeExcludedRocksDB
        jars = jars.filter { !it.name.startsWith('rocksdb') }
        jars.from(makeExcludedRocksDB)
    }
}

jar {
    from('LICENSE.md') { rename { "LICENSE_${project.archives_base_name}.md" } }
}

jmh {
    zip64 = true
    includes = ['SaveLoadJMH']
    jvmArgsAppend = ['--add-modules=jdk.incubator.vector']
}

// Unlike game integration tests, these fixed-mask checks need neither Minecraft nor GL.
tasks.register('bitPackingTest', JavaExec) {
    dependsOn testClasses
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'me.cortex.voxy.common.util.BitPackingTest'
}
tasks.named('check') { dependsOn 'bitPackingTest' }

tasks.register('textureUtilsTest', JavaExec) {
    dependsOn testClasses
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'me.cortex.voxy.client.core.model.TextureUtilsTest'
}
tasks.named('check') { dependsOn 'textureUtilsTest' }

tasks.register('vertexConsumerTest', JavaExec) {
    dependsOn testClasses
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'me.cortex.voxy.client.core.model.bakery.ReuseVertexConsumerTest'
}
tasks.named('check') { dependsOn 'vertexConsumerTest' }

tasks.register('nonAirCountTest', JavaExec) {
    dependsOn testClasses
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'me.cortex.voxy.common.world.NonAirCountTest'
    jvmArgs '--add-modules=jdk.incubator.vector'
}
tasks.named('check') { dependsOn 'nonAirCountTest' }

def indiumTestClasspath = sourceSets.main.compileClasspath.filter { it.name.startsWith('indium-') }
sourceSets.test.compileClasspath += indiumTestClasspath

tasks.register('indiumModelContextTest', JavaExec) {
    dependsOn testClasses
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = sourceSets.test.runtimeClasspath + indiumTestClasspath
    mainClass = 'me.cortex.voxy.client.core.model.bakery.IndiumModelContextTest'
}
tasks.named('check') { dependsOn 'indiumModelContextTest' }

tasks.register('dhPrototypeProbe', JavaExec) {
    dependsOn testClasses
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'me.cortex.voxy.client.iris.DhPrototypeProbe'
    args project.findProperty('dhProbeOutput') ?: layout.buildDirectory.dir('dh-prototype-probe').get().asFile.absolutePath
    doFirst { args project.property('dhProbeReference') }
}

tasks.register('dhPrototypeIdentityPack', Zip) {
    from 'src/test/resources/dh-prototype-identity'
    destinationDirectory = layout.buildDirectory.dir('dh-prototype-fixtures')
    archiveFileName = 'voxy-003-identity-dh.zip'
}

tasks.register('dhPrototypeNativePack', Zip) {
    from 'src/test/resources/dh-prototype-identity'
    from 'src/test/resources/dh-prototype-native'
    destinationDirectory = layout.buildDirectory.dir('dh-prototype-fixtures')
    archiveFileName = 'voxy-003-identity-native.zip'
}

tasks.register('dhTranslationTest', JavaExec) {
    dependsOn testClasses
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'me.cortex.voxy.client.iris.DhTranslationTest'
    jvmArgs '-Dvoxy.dhPrototype=pack'
    if (project.hasProperty('dhTranslationOutput')) {
        args project.property('dhTranslationOutput')
        if (project.hasProperty('dhTranslationCorpus')) args project.property('dhTranslationCorpus')
    }
}
tasks.named('check') { dependsOn 'dhTranslationTest' }
