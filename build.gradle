plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'me.champeau.jmh' version '0.7.3'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

def includeOtherArchs = 'true'.equalsIgnoreCase(project.findProperty('includeOtherArchs'))

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

// Loom's newer build-JDK native upgrade must not override the selected game graph.
configurations.configureEach {
    resolutionStrategy.eachDependency { dependency ->
        if (dependency.requested.group == 'org.lwjgl') dependency.useVersion(project.lwjgl_version)
    }
}

loom { accessWidenerPath = file('src/main/resources/voxy.accesswidener') }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "maven.modrinth:sodium:${project.sodium_version}"
    modCompileOnly "maven.modrinth:iris:${project.iris_version}"
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    modCompileOnly "maven.modrinth:lithium:${project.lithium_version}"
    modCompileOnly "maven.modrinth:chunky:${project.chunky_version}"
    modCompileOnly "maven.modrinth:vivecraft:${project.vivecraft_version}"
    modCompileOnly "maven.modrinth:nvidium:${project.nvidium_version}"

    // Minecraft owns core/OpenGL LWJGL; Voxy supplies only the matching storage bindings.
    implementation platform("org.lwjgl:lwjgl-bom:${project.lwjgl_version}")
    include implementation("org.lwjgl:lwjgl-lmdb:${project.lwjgl_version}")
    include implementation("org.lwjgl:lwjgl-zstd:${project.lwjgl_version}")
    ['natives-linux', 'natives-windows'].each { classifier ->
        include runtimeOnly("org.lwjgl:lwjgl-lmdb:${project.lwjgl_version}:${classifier}")
        include runtimeOnly("org.lwjgl:lwjgl-zstd:${project.lwjgl_version}:${classifier}")
    }
    if (includeOtherArchs) {
        include runtimeOnly("org.lwjgl:lwjgl-lmdb:${project.lwjgl_version}:natives-linux-arm64")
        include runtimeOnly("org.lwjgl:lwjgl-zstd:${project.lwjgl_version}:natives-linux-arm64")
    }
    include implementation('redis.clients:jedis:5.1.0')
    // Required Jedis runtime dependency absent from the 1.20.1 game classpath.
    include implementation('org.json:json:20231013')
    include implementation('org.rocksdb:rocksdbjni:10.2.1')
    include implementation('org.apache.commons:commons-pool2:2.12.0')
    include implementation('org.lz4:lz4-java:1.8.0')
    include implementation('org.tukaani:xz:1.10')
}

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.deprecation = true
}

def gitCommitHash = providers.exec {
    commandLine 'git', 'rev-parse', 'HEAD'
}.standardOutput.asText.map { it.trim() }

processResources {
    def props = [version: project.version, commit: gitCommitHash.get(),
                 buildtime: System.currentTimeMillis().intdiv(1000),
                 allowed_sodium_versions: '=0.5.13', allowed_mc_version: '=1.20.1']
    inputs.properties(props)
    filesMatching('fabric.mod.json') { expand(props) }
}

// Preserve upstream's smaller x86_64 RocksDB bundle without changing the storage engine.
def makeExcludedRocksDB = tasks.register('makeExcludedRocksDB', Zip) {
    archiveExtension = 'jar'
    entryCompression = ZipEntryCompression.STORED
    destinationDirectory = layout.buildDirectory.dir('tmp/rocksdb')
    def rocksdb = configurations.compileClasspath.filter { it.name.startsWith('rocksdbjni-') }
    from { zipTree(rocksdb.singleFile) }
    archiveFileName = 'rocksdbjni-10.2.1.jar'
    exclude { item ->
        def name = item.name
        name.endsWith('.jnilib') || (name.endsWith('.so') &&
            ['osx', 'linux32', 'musl', 's390x', 'riscv64', 'ppc64le', 'aarch64'].any(name::contains))
    }
}

if (!includeOtherArchs) {
    tasks.named('processIncludeJars') {
        dependsOn makeExcludedRocksDB
        jars = jars.filter { !it.name.startsWith('rocksdb') }
        jars.from(makeExcludedRocksDB)
    }
}

jar {
    from('LICENSE.md') { rename { "LICENSE_${project.archives_base_name}.md" } }
}

jmh {
    zip64 = true
    includes = ['SaveLoadJMH']
}

// Unlike game integration tests, these fixed-mask checks need neither Minecraft nor GL.
tasks.register('bitPackingTest', JavaExec) {
    dependsOn testClasses
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'me.cortex.voxy.common.util.BitPackingTest'
}
tasks.named('check') { dependsOn 'bitPackingTest' }

tasks.register('textureUtilsTest', JavaExec) {
    dependsOn testClasses
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'me.cortex.voxy.client.core.model.TextureUtilsTest'
}
tasks.named('check') { dependsOn 'textureUtilsTest' }

tasks.register('vertexConsumerTest', JavaExec) {
    dependsOn testClasses
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'me.cortex.voxy.client.core.model.bakery.ReuseVertexConsumerTest'
}
tasks.named('check') { dependsOn 'vertexConsumerTest' }
